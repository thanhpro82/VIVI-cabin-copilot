# Mosquitto cho VIVI Cabin Copilot — xem docs/mqtt_spec.md
#
# Broker chỉ bind loopback làm debug binding; traffic thật đi trên network
# `edge_internal` (internal: true). Không bao giờ expose ra interface
# non-loopback — docs/devops.md.

listener 1883
protocol mqtt

# docs/devops.md: MQTT_ALLOW_ANONYMOUS=false, hai identity tách biệt.
# Sinh hai file này bằng scripts/bootstrap_mqtt_secrets.ps1 trước khi chạy.
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Retained message của state/snapshot và health phải sống qua restart broker,
# nếu không subscriber nối vào sau sẽ không đọc được trạng thái hiện tại.
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
