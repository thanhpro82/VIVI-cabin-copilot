[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vivi-offline-poc"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pyyaml>=6,<7",
  "psutil>=6,<8",
  "langgraph>=1,<2",
  "numpy>=2,<3",
]

[project.optional-dependencies]
voice = [
  "transformers>=5.14,<6",
  "torch>=2.13,<3",
  "soundfile>=0.12,<1",
  "piper-tts>=1.3,<2",
]
rag = [
  "sentence-transformers>=3,<6",
  "faiss-cpu>=1.8,<2",
]
test = [
  "pytest>=8,<9",
  "pytest-cov>=5,<8",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
