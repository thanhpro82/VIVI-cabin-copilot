[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai20k-agent-p192"
version = "0.1.0"
description = "AI Agent Project for AI20K Build Phase (P-192)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "AI20K Team" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.3.0",
    "langgraph>=0.2.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "pymupdf>=1.24.0",
    "faiss-cpu>=1.8.0",
    "numpy>=1.26.0",
    # ADR-004 chốt Mosquitto + digital twin. Chặn trên <3 là cố ý: aiomqtt 3.0
    # đổi lõi từ paho-mqtt sang mqtt5 sans-io và tới 2026-08 vẫn còn alpha.
    "aiomqtt>=2.5,<3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.28.0",
    # Kiểm 6 JSON Schema ở schemas/mqtt/ — scripts/validate_mqtt_schemas.py
    "jsonschema>=4.23.0",
]
voice = [
    "piper-tts>=1.3,<2",
    "sherpa-onnx>=1.10,<2",
    # Mic capture for scripts/record_voice_hitl_samples.py (issue #198) — local
    # tooling only, not part of the runtime pipeline.
    "sounddevice>=0.4.6",
]
# Mô hình embedding thật — chỉ máy nhóm, không cài trên CI (xem requirements-rag.txt)
rag = [
    "sentence-transformers>=3.0.0",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: cần phụ thuộc nặng bên ngoài — mô hình embedding thật (sentence-transformers) hoặc broker Mosquitto thật (bật bằng MQTT_CONTRACT_TESTS=1). CI bỏ qua.",
    "integration: requires real local model assets; skipped by default (see docs/superpowers/specs/2026-08-07-voice-asr-tts-design.md)",
]

[tool.coverage.run]
source = ["src"]
omit = ["src/rag/cli.py"]

[tool.coverage.report]
# Mục tiêu tối thiểu theo docs/guide/chapter-08.md
fail_under = 60
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
